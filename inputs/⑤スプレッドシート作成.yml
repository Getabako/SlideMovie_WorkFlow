topic: "⑤スプレッドシート作成"

slides:
  - title: "AIでスプレッドシート効率化"
    content: |
      Gemini × Google スプレッドシート × GAS

      秋田県IT女性育成プログラム
      120分講座

  - title: "本日の目標"
    content: |
      - Geminiでリサーチしたデータを整理
      - スプレッドシートにデータをまとめる
      - GAS（Google Apps Script）の基本を知る
      - コピペでできる自動化を体験
      - 業務効率化の第一歩を踏み出す

  - title: "こんな悩みありませんか？"
    content: |
      ## 日々の業務で...

      - データ入力に時間がかかる
      - 毎回同じ作業を繰り返している
      - リサーチ結果の整理が面倒
      - プログラミングは難しそう...
      - 効率化したいけど方法がわからない

  - title: "今日使うツール"
    content: |
      ## すべて無料で使えます

      - **Gemini**: AIでリサーチ・コード生成
      - **Google スプレッドシート**: データ管理
      - **GAS**: 自動化スクリプト

      ※ Googleアカウントがあれば OK

  - title: "第1部：Geminiでリサーチ（25分）"
    content: |
      データ収集の効率化

  - title: "Geminiにアクセス"
    content: |
      ## 準備

      1. gemini.google.com にアクセス
      2. Googleアカウントでログイン
      3. チャット画面が表示されればOK

      **ポイント**: 日本語で質問できます

  - title: "リサーチのコツ"
    content: |
      ## 表形式でデータを取得

      **良いプロンプト例**
      ```
      秋田県の人気観光スポットを10件、
      以下の項目で表にまとめてください：
      - スポット名
      - 所在地
      - 特徴（20字以内）
      - おすすめ季節
      ```

  - title: "実習1：データ収集（10分）"
    content: |
      ## 課題：観光データを集める

      ```
      秋田県の名物料理を8つ、
      以下の形式で表にしてください：

      | 料理名 | 地域 | 主な材料 | 特徴 |
      ```

      Geminiに入力してみましょう！

  - title: "表データのコピー"
    content: |
      ## Geminiの回答をコピー

      1. Geminiが表を生成
      2. 表を選択してコピー（Ctrl+C）
      3. スプレッドシートに貼り付け

      **ヒント**: 「表形式で」と指定すると
      コピペしやすい形式で出力されます

  - title: "第2部：スプレッドシート整理（25分）"
    content: |
      データを見やすく整える

  - title: "スプレッドシート作成"
    content: |
      ## 新規作成手順

      1. sheets.google.com にアクセス
      2. 「空白」をクリック
      3. ファイル名を入力
         例：「秋田リサーチデータ」

  - title: "データの貼り付け"
    content: |
      ## Geminiの表を貼り付け

      1. A1セルをクリック
      2. Ctrl+V で貼り付け
      3. 表が自動で展開される

      **うまくいかない場合**
      「編集」→「特殊貼り付け」→
      「値のみ貼り付け」

  - title: "見やすく整える"
    content: |
      ## 基本の書式設定

      - **ヘッダー行を太字に**: 1行目を選択 → B
      - **列幅調整**: 列の境界をドラッグ
      - **罫線追加**: 範囲選択 → 罫線アイコン
      - **色分け**: 塗りつぶしで背景色

  - title: "実習2：データ整理（10分）"
    content: |
      ## 課題：表を整える

      1. Geminiで取得したデータを貼り付け
      2. ヘッダー行を太字・背景色
      3. 列幅を内容に合わせて調整
      4. 罫線を追加

  - title: "第3部：GASを知ろう（20分）"
    content: |
      コピペでできる自動化入門

  - title: "GASとは"
    content: |
      ## Google Apps Script

      **Googleのサービスを自動化するプログラム**

      - スプレッドシートの操作
      - メール送信
      - カレンダー連携
      - などなど...

      **今日の目標**: コピペで使えるようになる

  - title: "GASを開く"
    content: |
      ## スプレッドシートからアクセス

      1. スプレッドシートを開く
      2. メニュー「拡張機能」
      3. 「Apps Script」をクリック
      4. 新しいタブが開く

  - title: "GAS画面の見方"
    content: |
      ## 基本画面

      ```
      ┌─────────────────────────┐
      │ プロジェクト名          │
      ├─────────────────────────┤
      │ コード.gs              │
      │                         │
      │ function myFunction() { │
      │                         │
      │ }                       │
      └─────────────────────────┘
      ```

      ここにコードを貼り付けます

  - title: "Geminiにコードを書いてもらう"
    content: |
      ## プログラミング不要！

      **プロンプト例**
      ```
      Google スプレッドシートで
      A列の空白セルに「未入力」と
      自動で入れるGASコードを書いて
      ```

      Geminiが完成コードを出力！

  - title: "実習3：はじめてのGAS（10分）"
    content: |
      ## 課題：日付自動入力

      **Geminiに聞いてみよう**
      ```
      スプレッドシートのA1セルに
      今日の日付を自動入力する
      GASコードを書いてください。
      初心者向けにコメント付きで。
      ```

  - title: "コードの貼り付け方"
    content: |
      ## 手順

      1. Geminiのコードをコピー
      2. GAS画面の既存コードを全選択（Ctrl+A）
      3. 貼り付け（Ctrl+V）
      4. 保存（Ctrl+S）
      5. プロジェクト名を入力

  - title: "コードを実行する"
    content: |
      ## 実行方法

      1. 実行する関数を選択
      2. 「実行」ボタンをクリック
      3. 初回は「承認が必要」と表示
      4. 「権限を確認」→ アカウント選択
      5. 「許可」をクリック

  - title: "第4部：便利な自動化（30分）"
    content: |
      実践的なGAS活用

  - title: "自動化アイデア①"
    content: |
      ## 重複データの削除

      **Geminiへのプロンプト**
      ```
      スプレッドシートのA列で
      重複している値を削除する
      GASコードを書いてください
      ```

      データ整理が一瞬で完了！

  - title: "自動化アイデア②"
    content: |
      ## データの並べ替え

      **Geminiへのプロンプト**
      ```
      スプレッドシートの表を
      B列の値で昇順に並べ替える
      GASコードを書いてください
      ```

  - title: "自動化アイデア③"
    content: |
      ## 条件付き色分け

      **Geminiへのプロンプト**
      ```
      スプレッドシートのC列で
      値が100以上のセルを
      赤色にするGASコードを書いて
      ```

  - title: "実習4：好きな自動化を作る（15分）"
    content: |
      ## 自由課題

      自分が効率化したい作業を
      Geminiに相談してみよう！

      **例**
      - 特定の文字を含む行を抽出
      - 合計・平均を自動計算
      - 空白行を削除

  - title: "エラーが出たら"
    content: |
      ## トラブルシューティング

      **エラーメッセージが出たら**
      ```
      このエラーを解決してください：
      [エラーメッセージをコピペ]

      コード：
      [コードをコピペ]
      ```

      Geminiが修正版を教えてくれます

  - title: "第5部：ボタンで実行（15分）"
    content: |
      ワンクリック自動化

  - title: "ボタンの作り方"
    content: |
      ## 図形をボタンにする

      1. 「挿入」→「図形描画」
      2. 図形を作成（四角形など）
      3. テキスト追加「実行」
      4. 「保存して閉じる」
      5. 図形を右クリック
      6. 「スクリプトを割り当て」

  - title: "スクリプトの割り当て"
    content: |
      ## 関数名を入力

      ダイアログに関数名を入力
      （例：myFunction）

      ※ 関数名は function の後の名前

      ```
      function myFunction() {  ← これ
        // 処理内容
      }
      ```

  - title: "実習5：ボタン作成（5分）"
    content: |
      ## 課題

      1. 好きな図形でボタンを作成
      2. 作成したGASを割り当て
      3. ボタンをクリックして実行

      これでワンクリック自動化完成！

  - title: "第6部：応用編（15分）"
    content: |
      さらに便利な機能

  - title: "定期実行（トリガー）"
    content: |
      ## 自動で毎日実行

      **Geminiへのプロンプト**
      ```
      GASで毎日朝9時に
      自動実行するトリガーの
      設定方法を教えてください
      ```

      日報作成やデータ更新に便利

  - title: "メニューに追加"
    content: |
      ## カスタムメニュー作成

      **Geminiへのプロンプト**
      ```
      スプレッドシートに
      カスタムメニュー「便利ツール」を追加し
      その中に「データ整理」という
      項目を作るGASを書いてください
      ```

  - title: "複数の処理をまとめる"
    content: |
      ## 一括処理

      **Geminiへのプロンプト**
      ```
      以下の処理を順番に実行する
      GASを書いてください：
      1. A列の空白を「未入力」に
      2. B列で並べ替え
      3. 重複を削除
      ```

  - title: "便利なプロンプト集"
    content: |
      ## コピペで使えるテンプレート

      **データ整理**
      「〇列の△を□に置換するGAS」

      **書式設定**
      「条件に合うセルを強調するGAS」

      **計算**
      「〇列の合計を最終行に表示するGAS」

  - title: "GAS作成のコツ"
    content: |
      ## Geminiへの頼み方

      1. **やりたいことを具体的に**
      2. **シート名・範囲を明記**
      3. **初心者向けにとお願い**
      4. **コメント付きを依頼**
      5. **エラーはそのままコピペ**

  - title: "まとめ"
    content: |
      ## 本日の学び

      ✅ Geminiで表形式データ収集
      ✅ スプレッドシートでデータ整理
      ✅ GASの開き方・実行方法
      ✅ コピペでできる自動化
      ✅ ボタンでワンクリック実行
      ✅ エラー対処法

  - title: "できるようになったこと"
    content: |
      ## Before → After

      **Before**: 手作業でデータ整理
      **After**: AIで収集→自動整理

      **Before**: プログラミングは無理
      **After**: コピペで自動化できる

      **Before**: 同じ作業の繰り返し
      **After**: ボタン一つで完了

  - title: "実践課題"
    content: |
      ## 今週チャレンジ

      **課題1：仕事のデータを整理**
      - Geminiでリサーチ
      - スプレッドシートにまとめる

      **課題2：自動化を1つ作る**
      - よく使う作業をGAS化
      - ボタンを設置

  - title: "次回予告"
    content: |
      ## 「資料作り」講座

      - AIで調べた情報をまとめる
      - 見やすい資料レイアウト
      - 新聞風デザインに挑戦
      - 画像とテキストの配置

  - title: "参考リンク"
    content: |
      - **Gemini**: gemini.google.com
      - **スプレッドシート**: sheets.google.com
      - **GAS公式**: developers.google.com/apps-script

  - title: "質疑応答"
    content: |
      **困っていることはありますか？**

      よくある質問：
      - GASが動かない
      - エラーの意味がわからない
      - もっと複雑な自動化をしたい

  - title: "最後のメッセージ"
    content: |
      ## プログラミングは「コピペ」から

      難しいコードは
      AIに書いてもらえばOK！

      **まずは小さな自動化から
      始めてみましょう！**

  - title: "ありがとうございました！"
    content: |
      コピペでできる！
      あなたも今日から効率化マスター

      次回もお楽しみに
