- title: 本日の目標
  content: '- バナーデザインの基本を理解する

    - Canvaの使い方をマスターする

    - AIを活用したデザイン制作を学ぶ

    - 実際にバナーを作成できるようになる'
- title: アイスブレイク（5分）
  content: '### 質問

    デザインでこんな悩みはありませんか？


    - デザインの知識がない

    - Photoshopは難しそう

    - センスがないと思っている

    - プロに頼むと高額


    **Canva + AIで解決！**'
- title: 第1部：バナーデザインの基本（25分）
  content: ''
- title: バナーとは？
  content: '**情報を視覚的に伝える広告・告知用の画像**


    ### 用途

    - Webサイトの広告

    - SNS投稿

    - イベント告知

    - キャンペーン宣伝

    - ブログのアイキャッチ'
- title: バナーの種類とサイズ
  content: '### Web広告

    - レクタングル：300×250px

    - ビッグバナー：728×90px

    - スカイスクレイパー：160×600px


    ### SNS

    - Instagram投稿：1080×1080px

    - Facebook カバー：820×312px

    - Twitter ヘッダー：1500×500px


    ### その他

    - YouTube サムネイル：1280×720px

    - ブログ アイキャッチ：1200×630px'
- title: 良いバナーの3原則
  content: '### 1. 一目でわかる

    - メッセージが明確

    - 視線誘導がスムーズ

    - 3秒ルール（3秒で理解できる）


    ### 2. 目を引く

    - インパクトのある色

    - 魅力的なビジュアル

    - 適度なコントラスト


    ### 3. 行動を促す

    - 明確なCTA（Call To Action）

    - わかりやすいボタン

    - 誘導する言葉'
- title: 悪いバナーの例
  content: '```

    ┌─────────────────┐

    │ 新商品発売！！！    │

    │ とってもお得です    │

    │ 詳しくはこちら      │

    │ 今すぐクリック      │

    │ 期間限定です        │

    │ お見逃しなく！      │

    └─────────────────┘

    ```


    ### 問題点

    - 文字が多すぎる

    - 何の商品かわからない

    - ごちゃごちゃしている

    - ビジュアルがない'
- title: 良いバナーの例
  content: '```

    ┌─────────────────┐

    │   [商品画像]        │

    │                     │

    │  春の新作コーヒー   │

    │   50%OFF           │

    │                     │

    │  [詳細を見る]      │

    └─────────────────┘

    ```


    ### 改善点

    - ビジュアルが目立つ

    - メッセージが明確

    - シンプル

    - CTAがわかりやすい'
- title: バナーデザインの構成要素
  content: '### 1. キャッチコピー

    - 大きく、目立つ

    - 短く、インパクト


    ### 2. ビジュアル（画像）

    - 商品やサービスを表現

    - 高品質


    ### 3. 補足情報

    - 期間、価格、特典など

    - 読みやすいサイズ


    ### 4. CTA（行動喚起）

    - ボタンやリンク

    - 「詳細を見る」「今すぐ購入」'
- title: デザインの基本ルール
  content: '### 色の使い方

    - **3色まで**：ベース、メイン、アクセント

    - **コントラスト**：文字が読みやすく

    - **色の意味**：赤=情熱、青=信頼、緑=安心


    ### フォント

    - **2種類まで**：タイトルと本文

    - **サイズに差**：階層を明確に

    - **読みやすさ**：ゴシック体が無難


    ### レイアウト

    - **余白**：詰め込まない

    - **整列**：要素を揃える

    - **視線誘導**：Z型、F型'
- title: 第2部：Canvaの基本（30分）
  content: ''
- title: Canvaとは？
  content: '**無料で使えるオンラインデザインツール**


    ### 特徴

    - ✅ ブラウザで動作（インストール不要）

    - ✅ 豊富なテンプレート

    - ✅ ドラッグ&ドロップで簡単

    - ✅ 無料プランが充実

    - ✅ AI機能搭載


    ### アクセス

    **https://www.canva.com/**'
- title: Canvaでできること
  content: '### 1. バナー・SNS画像

    - 各種サイズのテンプレート

    - すぐに作れる


    ### 2. プレゼン資料

    - スライド作成

    - アニメーション


    ### 3. 印刷物

    - チラシ、名刺、ポスター


    ### 4. 動画編集

    - 簡単な動画作成'
- title: Canvaの登録（5分）
  content: '### 手順

    1. https://www.canva.com/ にアクセス

    2. 「登録」をクリック

    3. Googleアカウントで登録（推奨）

    4. 無料プランを選択


    **実際に登録してみましょう**'
- title: Canvaの画面構成
  content: '### 主要エリア

    1. **テンプレート**：左側

    2. **キャンバス**：中央（作業エリア）

    3. **ツールバー**：上部

    4. **素材パネル**：左側


    ### 基本操作

    - ドラッグ&ドロップ

    - クリックで選択

    - ダブルクリックで編集'
- title: 実習1：テンプレートから作成（15分）
  content: '### 課題

    Instagram投稿用のバナーを作る


    ### 手順

    1. 「デザインを作成」をクリック

    2. 「Instagram 投稿」を選択

    3. テンプレートを選ぶ

    4. 文字を自分の内容に変更

    5. 色や画像をカスタマイズ

    6. ダウンロード


    **実際に作ってみましょう**'
- title: テキストの編集
  content: '### 基本操作

    1. テキストをクリック

    2. 内容を入力

    3. フォントを選択

    4. サイズ調整

    5. 色変更

    6. 配置調整


    ### ショートカット

    - **Ctrl + B**：太字

    - **Ctrl + Z**：元に戻す

    - **Ctrl + D**：複製'
- title: 画像の追加と編集
  content: '### 画像を追加

    1. 左メニューから「素材」

    2. 検索バーで画像検索

    3. 気に入った画像をクリック

    4. キャンバスに配置


    ### 編集

    - サイズ変更：角をドラッグ

    - 移動：ドラッグ

    - 削除：選択してDelete'
- title: 実習2：ゼロから作成（10分）
  content: '### 課題

    空白のキャンバスからバナー作成


    ### テーマ

    「カフェの新メニュー告知」


    ### 手順

    1. 空白のデザインを開始

    2. 背景色を設定

    3. テキストを追加

    4. 画像を追加

    5. 装飾を加える'
- title: 休憩（10分）
  content: ''
- title: 第3部：AIを活用したデザイン（35分）
  content: ''
- title: CanvaのAI機能
  content: '### 1. Magic Write（文章生成）

    - キャッチコピー作成

    - 説明文作成


    ### 2. Magic Design（デザイン生成）

    - 自動レイアウト

    - カラーパレット提案


    ### 3. Background Remover（背景削除）

    - ワンクリックで背景除去


    ### 4. Magic Edit（画像編集）

    - AI画像補正'
- title: GeminiでCanvaを支援
  content: '### デザイン前の準備


    ```

    以下の内容でInstagram投稿用バナーを

    作りたいです。


    目的：新商品の告知

    商品：オーガニックコーヒー

    ターゲット：30代女性

    トーン：ナチュラル、おしゃれ


    効果的なキャッチコピーと

    デザインの方向性を提案してください。

    ```'
- title: 実習3：Gemini + Canva（20分）
  content: '### ステップ1：Geminiで企画

    ```

    バナーのテーマ：[あなたのテーマ]

    目的：[目的]

    ターゲット：[ターゲット]


    キャッチコピー、配色、

    デザインの方向性を提案してください。

    ```


    ### ステップ2：Canvaで実装

    Geminiの提案をもとにデザイン


    **実際に作ってみましょう**'
- title: キャッチコピーをGeminiに依頼
  content: '### プロンプト例

    ```

    以下の商品・サービスのバナー用

    キャッチコピーを5パターン作成してください。


    商品：Webデザイン講座

    特徴：初心者向け、オンライン、3ヶ月

    ターゲット：IT転職希望の女性

    訴求ポイント：未経験OK、実践的、就職支援


    各コピーは15文字以内で。

    ```'
- title: 配色をGeminiに相談
  content: '### プロンプト例

    ```

    以下のイメージに合う配色を

    3パターン提案してください。


    イメージ：

    ・ナチュラル

    ・女性向け

    ・温かみがある

    ・信頼感


    各色のカラーコード（#XXXXXX）と

    使い方（背景、メイン、アクセント）も

    教えてください。

    ```'
- title: レイアウトの相談
  content: '### プロンプト例

    ```

    バナーのレイアウトについて

    アドバイスをください。


    サイズ：1080×1080px（Instagram投稿）

    要素：

    - 商品画像

    - キャッチコピー

    - 説明文（1行）

    - CTAボタン


    効果的な配置を教えてください。

    ```'
- title: 実習4：完全オリジナルバナー（15分）
  content: '### 課題

    GeminiとCanvaを使って完全オリジナル


    ### テーマ例

    1. イベント告知

    2. サービス紹介

    3. セール告知

    4. 求人募集


    **アイデア→デザイン→完成まで**'
- title: 第4部：実践テクニック（15分）
  content: ''
- title: テクニック1：背景をAI画像で
  content: '### 手順

    1. Geminiで背景画像を生成

    2. ダウンロード

    3. Canvaにアップロード

    4. 背景として使用


    ### メリット

    - オリジナリティ

    - イメージ通り

    - 無料'
- title: テクニック2：ブランドキット
  content: '### 統一感のあるデザイン


    ### 設定内容

    - ブランドカラー（3色）

    - ブランドフォント（2種類）

    - ロゴ


    ### Geminiに相談

    ```

    以下のブランドのカラーパレットと

    フォントを提案してください。


    ブランド：[名前]

    業種：[業種]

    イメージ：[イメージ]

    ```'
- title: テクニック3：複数サイズを一括作成
  content: '### Canvaの機能

    1. デザインを作成

    2. 「サイズ変更」をクリック

    3. 別のサイズを選択

    4. 自動で調整


    ### 便利な使い方

    Instagram → Twitter → Facebook

    と一度に複数サイズ作成'
- title: テクニック4：A/Bテスト用バリエーション
  content: '### Geminiに依頼

    ```

    同じ内容で、異なるデザインアプローチの

    バナーを3パターン提案してください。


    内容：[バナーの内容]


    1. 文字中心

    2. 画像中心

    3. ミニマル


    それぞれの特徴とターゲット層への

    訴求力を説明してください。

    ```'
- title: 実習5：テクニック活用（10分）
  content: '### 複数パターン作成


    1. 同じ内容で3パターン

    2. 色違い

    3. レイアウト違い

    4. トーン違い


    **どれが一番効果的か比較**'
