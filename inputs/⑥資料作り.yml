topic: "⑥資料作り"

slides:
  - title: "AIで「伝わる資料」を作ろう"
    content: |
      リサーチ結果を新聞風にまとめる

      秋田県IT女性育成プログラム
      120分講座

  - title: "本日の目標"
    content: |
      - AIで調べた情報を整理する
      - 見やすいレイアウトを学ぶ
      - 画像とテキストを効果的に配置
      - 新聞風の資料を完成させる
      - 人に伝わる資料作りのコツ

  - title: "こんな悩みありませんか？"
    content: |
      ## 資料作りで困ること

      - 情報をどう整理すればいいかわからない
      - レイアウトがごちゃごちゃする
      - 見栄えの良い資料が作れない
      - 文字ばかりで読みにくい
      - どこから手をつければいいか迷う

  - title: "今日のゴール"
    content: |
      ## 新聞風の1ページ資料

      ```
      ┌────────────────────────┐
      │    大見出し            │
      ├──────────┬─────────────┤
      │  記事1   │   画像      │
      │          │             │
      ├──────────┼─────────────┤
      │  画像    │   記事2     │
      │          │             │
      └──────────┴─────────────┘
      ```

  - title: "今日使うツール"
    content: |
      ## 無料で使えます

      - **Gemini / ChatGPT**: 情報収集・文章作成
      - **Canva**: デザイン・レイアウト
      - **Googleドキュメント**: 文書作成（代替）

      ※ Canvaがおすすめ！

  - title: "第1部：情報を整理する（25分）"
    content: |
      伝えたいことを明確にする

  - title: "情報整理の3ステップ"
    content: |
      ## 整理の流れ

      1. **集める**: AIでリサーチ
      2. **選ぶ**: 本当に必要な情報だけ残す
      3. **並べる**: 重要度順に配置

  - title: "AIで情報を集める"
    content: |
      ## リサーチのプロンプト

      ```
      秋田県の〇〇について、
      以下の観点でまとめてください：

      - 概要（100字以内）
      - 特徴3つ（各50字以内）
      - 具体例やデータ
      - 参考になる情報源
      ```

  - title: "実習1：情報収集（10分）"
    content: |
      ## 課題：テーマを調べる

      好きなテーマで情報収集：
      - 秋田の特産品
      - 地域のイベント
      - 観光スポット
      - 郷土料理

      Geminiに聞いてみよう！

  - title: "情報の取捨選択"
    content: |
      ## 選ぶ基準

      **残す情報**
      - 読者が知りたいこと
      - データや具体例
      - 意外性のある事実

      **削る情報**
      - 当たり前のこと
      - 細かすぎる詳細
      - 重複する内容

  - title: "情報を構造化する"
    content: |
      ## 新聞記事の構成

      **逆三角形の法則**
      ```
      ┌─────────────┐
      │   結論     │ ← 最重要
      ├─────────────┤
      │   概要     │ ← 重要
      ├─────────────┤
      │   詳細     │ ← 補足
      └─────────────┘
      ```

      最初に結論！

  - title: "第2部：Canvaを使おう（25分）"
    content: |
      デザインツールの基本操作

  - title: "Canvaとは"
    content: |
      ## 無料で使えるデザインツール

      **特徴**
      - テンプレートが豊富
      - ドラッグ＆ドロップで簡単
      - 日本語フォント対応
      - 画像素材も無料で使える

      **URL**: canva.com

  - title: "Canvaにログイン"
    content: |
      ## 準備

      1. canva.com にアクセス
      2. 「登録」をクリック
      3. Googleアカウントでログイン
      4. ホーム画面が表示されればOK

  - title: "新聞風テンプレート"
    content: |
      ## テンプレートを探す

      1. 検索バーに「新聞」と入力
      2. 好みのデザインを選択
      3. 「このテンプレートを使用」

      **ヒント**: 「ニュースレター」でも検索

  - title: "基本操作を覚える"
    content: |
      ## Canvaの操作

      - **テキスト編集**: ダブルクリック
      - **移動**: ドラッグ＆ドロップ
      - **サイズ変更**: 角をドラッグ
      - **削除**: 選択してDelete
      - **コピー**: Ctrl+C → Ctrl+V

  - title: "実習2：テンプレート選択（5分）"
    content: |
      ## 課題

      1. Canvaで「新聞」を検索
      2. 気に入ったテンプレートを選ぶ
      3. 編集画面を開く

      まだ編集しなくてOK！

  - title: "第3部：テキストを入れる（20分）"
    content: |
      読みやすい文章配置

  - title: "見出しを決める"
    content: |
      ## 目を引く見出しのコツ

      **良い例**
      - 「秋田美人の秘密は〇〇だった」
      - 「知られざる秋田の絶景スポット5選」

      **NGな例**
      - 「秋田県について」（漠然としすぎ）
      - 「情報のまとめ」（つまらない）

  - title: "AIで見出しを作る"
    content: |
      ## プロンプト例

      ```
      以下の内容を元に、
      新聞の見出しを5案作ってください。
      読者の興味を引く表現で：

      [調べた内容を貼り付け]
      ```

  - title: "本文の書き方"
    content: |
      ## 読みやすい文章のルール

      - 1文は40字以内
      - 1段落は3〜4文まで
      - 専門用語は説明を添える
      - 数字は具体的に

      **例**: 「多い」→「年間100万人」

  - title: "AIで文章を整える"
    content: |
      ## プロンプト例

      ```
      以下の文章を新聞記事風に
      書き直してください。
      200字以内で、小学生でも
      わかるように：

      [元の文章]
      ```

  - title: "実習3：テキスト入力（10分）"
    content: |
      ## 課題

      1. 大見出しを入力
      2. 記事本文を2〜3段落入力
      3. フォントサイズを調整

      **ポイント**
      - 見出し: 大きく太く
      - 本文: 読みやすいサイズ

  - title: "第4部：画像を配置する（20分）"
    content: |
      視覚的な魅力をプラス

  - title: "画像の役割"
    content: |
      ## なぜ画像が必要？

      - 文字だけより目を引く
      - 内容が伝わりやすい
      - 記憶に残りやすい
      - デザインが華やかに

      **目安**: 画像30%、テキスト70%

  - title: "Canvaの素材を使う"
    content: |
      ## 無料画像の探し方

      1. 左メニュー「素材」をクリック
      2. キーワードで検索
         例：「秋田」「食べ物」「風景」
      3. 画像をクリックして配置

      **王冠マーク = 有料**（避ける）

  - title: "AIで画像を生成"
    content: |
      ## Canvaの画像生成

      1. 左メニュー「アプリ」
      2. 「AI画像生成」を選択
      3. イメージを文章で入力
      4. 「画像を生成」

      **例**: 「秋田の田園風景、夕暮れ」

  - title: "画像配置のコツ"
    content: |
      ## バランスよく配置

      **ルール**
      - 左右対称に配置
      - 余白を残す
      - 文字と重ならないように
      - 関連する記事の近くに

  - title: "実習4：画像配置（10分）"
    content: |
      ## 課題

      1. テーマに合う画像を2〜3枚選ぶ
      2. バランスよく配置
      3. サイズを調整

      **ポイント**
      - 画像は記事と関連付ける
      - 大きすぎ・小さすぎに注意

  - title: "第5部：レイアウト調整（20分）"
    content: |
      プロっぽく仕上げる

  - title: "新聞らしいレイアウト"
    content: |
      ## 段組みを意識

      ```
      ┌───────┬───────┬───────┐
      │       大見出し         │
      ├───────┼───────┼───────┤
      │ 記事1 │ 記事2 │ 記事3 │
      │       │       │       │
      │ 画像  │       │ 画像  │
      └───────┴───────┴───────┘
      ```

      2〜3段組みがおすすめ

  - title: "色の使い方"
    content: |
      ## 統一感を出す

      **ルール**
      - メインカラー: 1色
      - アクセントカラー: 1色
      - 背景: 白または薄い色

      **秋田をイメージした色**
      - 稲穂の黄金色
      - 日本海のブルー
      - なまはげの赤

  - title: "フォントの選び方"
    content: |
      ## 読みやすさ重視

      **見出し**: 太字のゴシック体
      **本文**: 明朝体 or ゴシック体

      **おすすめフォント**
      - Noto Sans JP
      - Noto Serif JP
      - BIZ UDゴシック

  - title: "余白の大切さ"
    content: |
      ## 詰め込みすぎNG

      **余白があると**
      - 読みやすい
      - 洗練された印象
      - 重要な情報が目立つ

      **目安**: 全体の20%は余白

  - title: "実習5：仕上げ（10分）"
    content: |
      ## 最終調整

      1. 全体のバランスを確認
      2. 色を統一
      3. 余白を調整
      4. 誤字脱字チェック

  - title: "第6部：保存と共有（10分）"
    content: |
      完成した資料を活用する

  - title: "ダウンロード方法"
    content: |
      ## 保存形式

      1. 右上「共有」→「ダウンロード」
      2. ファイル形式を選択

      **PDF**: 印刷用
      **PNG**: Web・SNS用
      **JPG**: 軽いデータ

  - title: "印刷のコツ"
    content: |
      ## きれいに印刷するには

      - **PDF形式で保存**
      - **高品質を選択**
      - **余白設定を確認**

      コンビニプリントも可能！

  - title: "共有方法"
    content: |
      ## 簡単に共有

      **リンクで共有**
      1. 「共有」→「リンクをコピー」
      2. LINEやメールで送信

      **SNS投稿**
      1. 「共有」→ SNSアイコン選択
      2. 直接投稿

  - title: "作品発表タイム（10分）"
    content: |
      ## みんなの資料を見てみよう

      - 工夫したポイント
      - 難しかったこと
      - 気に入っているところ

      お互いの作品から学ぼう！

  - title: "プロのコツ"
    content: |
      ## さらに上達するには

      - 新聞や雑誌のレイアウトを観察
      - Canvaのテンプレートを研究
      - いろんなデザインを試す
      - フィードバックをもらう

  - title: "まとめ"
    content: |
      ## 本日の学び

      ✅ AIで情報を効率的に収集
      ✅ 情報の取捨選択と構造化
      ✅ Canvaの基本操作
      ✅ 見出し・本文の書き方
      ✅ 画像配置とレイアウト
      ✅ 新聞風資料の完成

  - title: "できるようになったこと"
    content: |
      ## Before → After

      **Before**: 文字だけの資料
      **After**: 視覚的で伝わる資料

      **Before**: レイアウトが苦手
      **After**: テンプレートで簡単

      **Before**: 時間がかかる
      **After**: AIで効率化

  - title: "実践課題"
    content: |
      ## 今週チャレンジ

      **課題1：もう1枚作る**
      - 違うテーマで新聞風資料
      - 家族や友人に見せる

      **課題2：フィードバック**
      - 感想をもらう
      - 改善点を見つける

  - title: "活用アイデア"
    content: |
      ## こんな場面で使える

      - 地域のお知らせ
      - イベント告知
      - 商品紹介
      - 報告書
      - 家族新聞
      - 趣味の紹介

  - title: "次回予告"
    content: |
      ## 次のステップへ

      今後の講座もお楽しみに！

      - プレゼン資料作成
      - SNS活用術
      - AI活用の応用編

  - title: "参考リンク"
    content: |
      - **Canva**: canva.com
      - **Gemini**: gemini.google.com
      - **Googleドキュメント**: docs.google.com

  - title: "質疑応答"
    content: |
      **わからないことはありますか？**

      よくある質問：
      - Canvaの細かい操作
      - 画像の著作権について
      - 印刷がうまくいかない

  - title: "最後のメッセージ"
    content: |
      ## 「伝わる」を意識する

      見た目がきれいなだけでなく、
      読む人のことを考えた資料を。

      **AIはあなたの
      クリエイティブをサポートします！**

  - title: "ありがとうございました！"
    content: |
      あなたの資料が
      誰かの心に届きますように

      お疲れさまでした！
