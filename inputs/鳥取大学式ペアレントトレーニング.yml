topic: "鳥取大学式ペアレントトレーニング"

slides:
  - title: "その一言が、子どもの部屋のドアを閉める"
    content: |
      鳥取大学式ペアレントトレーニング

      〜引きこもりのお子さんとの関わり方を変える実践講座〜

  - title: "こんな経験、ありませんか？"
    content: |
      ## 保護者のリアルな悩み

      - 「やっと部屋から出てきたのに、一言で戻ってしまった」
      - 「何を言っても無視される。話しかけるのが怖い」
      - 「褒めたいけど、褒めるところが本当に見つからない」
      - 「自分の育て方が悪かったんじゃないかと毎日責めてしまう」

      → あなたが悪いのではありません。「関わり方」を変えるだけで状況は動き出します

  - title: "この講座で得られること"
    content: |
      ## 今日からすぐ使える「3つの武器」

      1. 子どもの行動を冷静に分析する「3分類フレームワーク」
      2. 引きこもり場面で使える「科学的に正しい声掛け」
      3. 親も子も追い詰めない「スモールステップ戦略」

      → 知識だけでなく、ワークで体感して帰っていただきます

  - title: "講師紹介"
    content: |
      ## 塾頭 高崎翔太

      if塾 代表
      発達支援・教育の専門家

      - 発達障害・不登校・引きこもりの子どもと保護者を多数支援
      - 鳥取大学式ペアレントトレーニングの知見を現場で実践
      - 「正論より、明日使えるスキル」がモットー

  - title: "ペアレントトレーニングとは？"
    content: |
      ## 「親を責める」のではなく「親にスキルを渡す」プログラム

      - 子どもを変えようとするのではなく、関わり方を変える
      - 叱る・怒るに頼らない具体的なテクニックを学ぶ
      - ABA（応用行動分析）という科学的根拠に基づいた方法
      - 正しく使えば、何年引きこもっていても関係性は変わる

  - title: "鳥取大学式の特徴"
    content: |
      ## 日本の家庭に最適化されたプログラム

      - 井上雅彦教授（鳥取大学）が日本の家庭向けに開発
      - 「褒める」「無視する」「制限する」の3原則がシンプル
      - 保護者同士で学び合うグループ形式
      - 宿題で家庭実践→振り返りのサイクル

      **if塾では、このメソッドを引きこもり支援に特化してアレンジしています**

  - title: "なぜこのアプローチが引きこもりに効くのか"
    content: |
      ## 「本人に会えなくても」状況を変えられる

      - 引きこもりの子に直接アプローチするのは困難
      - でも保護者の関わり方が変われば、子どもの行動も変わる
      - 家庭内の「空気」を変えることが第一歩
      - 訪問看護師・支援者が保護者のコーチ役になれる

      → まず変わるのは「親」。でもそれは親が悪いからではない

  - title: "行動を3つに分ける"
    content: |
      ## すべての基本：信号機ルール

      🟢 好ましい行動（増やしたい）
      部屋のドアを開けている、リビングに来た、返事をした

      🟡 好ましくない行動（減らしたい）
      暴言、昼夜逆転、ドア越しに怒鳴る

      🔴 危険な行動（すぐ止める）
      自傷行為、物を壊す、家族への暴力

  - title: "3分類への対応の原則"
    content: |
      ## 色で覚える対応ルール

      🟢 好ましい行動 → すかさず褒める・注目する
      「リビングに来てくれたんだね」

      🟡 好ましくない行動 → 計画的に無視する
      反応しない。でも人格は否定しない

      🔴 危険な行動 → 冷静に制限を設ける
      感情的にならず、毅然と対応する

  - title: "【ワーク①】お子さんの行動を分類してみよう"
    content: |
      ## 3分間ワーク

      最近1週間のお子さんの行動を思い出してください

      🟢 好ましい行動は？
      （どんな小さなことでもOK）

      🟡 好ましくない行動は？

      🔴 危険な行動は？

      → 書き出すだけで「褒めポイント」が見つかります

  - title: "肯定的な注目とは？"
    content: |
      ## 「当たり前」を「ありがとう」に変える技術

      - 起きてきた → 「おはよう。顔見られて嬉しい」
      - ご飯を食べた → 「一緒に食べられてよかった」
      - 返事をした → 「答えてくれてありがとう」

      **25%ルール：完璧じゃなくてもいい。少しでもできたら声をかける**

      → 「そんな当たり前のこと褒めるの？」→ はい、それが一番効きます

  - title: "知っていましたか？「注目」の科学的効果"
    content: |
      ## 行動分析学が証明した事実

      - 人の行動の多くは「注目されるかどうか」で増減する
      - 叱っても「注目を与えている」ので行動は減らない
      - 褒められた行動は繰り返される確率が高まる

      **つまり：「叱る」も「褒める」も同じ「注目」。どちらを選ぶかで結果が変わる**

      → だからこそ、好ましい行動に注目を集中させることが重要

  - title: "声掛け例① 部屋から出てきた時"
    content: |
      ## 最も多い失敗パターンと正解

      ❌ やりがちなNG
      「やっと出てきたの？」
      「いつもこうならいいのに」

      ✅ 科学的に正しい声掛け
      「リビングに来てくれたんだね」
      「一緒にいられて嬉しいよ」

      **なぜ効くのか：「出てきた行動そのもの」に注目している。余計な条件や皮肉がない**

  - title: "声掛け例② 食事を一緒にとれた時"
    content: |
      ## 「次の要求」を絶対に上乗せしない

      ❌ やりがちなNG
      「毎日こうやって食べてくれればいいのに」
      「食べたら少しは外に出たら？」

      ✅ 科学的に正しい声掛け
      「一緒にご飯食べられて嬉しい」
      「ゆっくり食べてね」

      **なぜ効くのか：「今この瞬間」だけを肯定している。次を求めるとプレッシャーになる**

  - title: "声掛け例③ 少しだけ会話ができた時"
    content: |
      ## 会話が途切れても成功

      ❌ やりがちなNG
      「もっと話してよ」
      「学校のこと考えてる？」

      ✅ 科学的に正しい声掛け
      「教えてくれてありがとう」
      「そうなんだね」

      **なぜ効くのか：一言でも話せたことを「成功体験」にしている。深追いしない**

  - title: "【ワーク②】あなたならどう声をかける？"
    content: |
      ## ロールプレイワーク

      **場面：3日間部屋から出なかった子が、夜中にリビングに来てカップ麺を食べている**

      あなたならどう声をかけますか？

      → ポイント：つい言いたくなる「余計な一言」を我慢できるか

      NGワード候補：「こんな時間に」「せめて昼間に」「カップ麺ばっかり」

  - title: "CCQ：効果的な指示の出し方"
    content: |
      ## 3つのCを覚えるだけ

      **Calm** 穏やかに：深呼吸してから話しかける
      **Close** 近づいて：ドア越しに叫ばない
      **Quiet** 静かに：小さめの声でゆっくりと

      **指示のコツ**
      - 「ゲームやめなさい」→「ご飯できたよ。一緒に食べよう」
      - 一度に一つだけ伝える
      - 選択肢を与える（「お茶とジュース、どっちがいい？」）

  - title: "計画的無視と消去バースト"
    content: |
      ## 好ましくない行動への切り札

      **計画的無視のルール**
      - 暴言→反応しない。落ち着いた時に「さっきは辛かったね」
      - 行動を無視する。人格は絶対に否定しない

      **消去バースト：最初は必ず悪化する**
      - 「今まで反応してくれたのに！」と行動がエスカレート
      - ここで折れると「もっとやれば反応する」と学習してしまう
      - 家族全員で方針を統一することが必須

  - title: "ブロークンレコード法"
    content: |
      ## 同じことを穏やかに繰り返すだけ

      子「うるさい！放っておいて！」
      親「心配しているよ」
      子「来るなって言ってるだろ！」
      親「心配しているよ。ご飯はここに置いておくね」

      **ルール**
      - 感情的にならない
      - 売り言葉に買い言葉をしない
      - 伝えたいメッセージだけを壊れたレコードのように繰り返す

  - title: "スモールステップで考える"
    content: |
      ## 「外に出す」をゴールにしない

      **引きこもりのステップ例**
      ステップ1：部屋のドアが開いている
      ステップ2：リビングに顔を出す
      ステップ3：家族と食事をとる
      ステップ4：近所のコンビニに行く
      ステップ5：短時間の外出

      → 各ステップで「できた」を認める。後戻りしても絶対に責めない
      → 半年で1ステップ進めば大成功

  - title: "実践者の声：関わり方を変えたら子どもが変わった"
    content: |
      ## ペアレントトレーニング実践後の変化（よくある事例）

      **Before**
      毎日叱る→子ども反発→親が疲弊→さらに叱る…の悪循環

      **After（3〜6ヶ月後）**
      - 親が「出てきただけで嬉しい」と伝えるようになった
      - 子どもがリビングにいる時間が少しずつ増えた
      - 親自身が「自分も変われた」と実感

      **鍵は「一貫した対応を続けること」と「一人で抱え込まないこと」**

  - title: "保護者自身のケア"
    content: |
      ## 親が倒れたら元も子もない

      - 自分を責めすぎない。あなたのせいではない
      - 完璧な親を目指さなくていい。60点で十分
      - 一人で抱え込まない。相談先を複数持つ
      - 小さな変化に気づける「記録の習慣」を持つ

      **「知識はわかった。でも一人で実践するのは本当に難しい」**
      → だからこそプロの伴走が必要なのです

  - title: "まとめ：今日から始める3つのこと"
    content: |
      ## 明日からこれだけやってみてください

      1. お子さんの「好ましい行動」を1つ見つけて声をかける
         （起きた、食べた、返事した、何でもOK）

      2. 「余計な一言」を1回だけ我慢してみる
         （「やっと」「いつも」「せめて」を飲み込む）

      3. 今日の気づきを1行だけメモする
         （行動観察の第一歩）

  - title: "一人で抱え込まないでください"
    content: |
      ## if塾の個別サポートプログラム

      「知識はわかった。でも実践で壁にぶつかる」
      → それは当然です。プロの伴走者と一緒に取り組みましょう

      **if塾ができること**
      - 個別相談：お子さんの状況に合わせた対応プラン作成
      - 定期フォロー：行動観察シートの振り返りと改善
      - 保護者グループ：同じ悩みを持つ仲間との学び合い

      まずはお気軽にご相談ください
      if塾 代表 高崎翔太
